<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n8n Webhook Tester</title>
    <!-- Pretendard 폰트 불러오기 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            /* 파란색 계열 테마 컬러 */
            --primary-color: #2563eb;       /* 로열 블루 */
            --primary-hover: #1d4ed8;
            --bg-color: #f0f7ff;            /* 매우 밝은 아이스 블루 */
            --card-bg: rgba(255, 255, 255, 0.85); /* 반투명 화이트 */
            --card-border: rgba(255, 255, 255, 0.8);
            --text-main: #0f172a;           /* 진한 다크 블루 */
            --text-sub: #64748b;            /* 슬레이트 블루/그레이 */
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }

        body {
            /* 화사하고 청량한 파란색 그라데이션 배경 */
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(56, 189, 248, 0.25) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(99, 102, 241, 0.2) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(186, 230, 253, 0.3) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Glassmorphism 밝은 카드 */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 480px;
            padding: 36px;
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 40px rgba(37, 99, 235, 0.08), 0 10px 15px -3px rgba(0, 0, 0, 0.03);
        }

        .header {
            margin-bottom: 28px;
        }

        .header .badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary-color);
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 20px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            border: 1px solid rgba(37, 99, 235, 0.2);
        }

        .header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.875rem;
            color: var(--text-sub);
            word-break: break-all;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            outline: none;
            transition: all 0.25s ease;
            color: var(--text-main);
            background-color: var(--input-bg);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        button {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .result-container {
            margin-top: 28px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .result-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-box {
            background-color: #f8fafc;
            border-radius: 10px;
            padding: 16px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.875rem;
            color: #334155;
            min-height: 80px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        /* 상태별 알림 색상 */
        .result-box.success {
            background-color: #f0fdf4;
            border-color: #86efac;
            color: #166534;
        }

        .result-box.error {
            background-color: #fef2f2;
            border-color: #fca5a5;
            color: #991b1b;
        }

        /* 로딩 스피너 애니메이션 */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <span class="badge">n8n Automation</span>
            <h2>Webhook 요청하기</h2>
            <p>POST https://digicope.app.n8n.cloud/...</p>
        </div>

        <div class="form-group">
            <label for="nameInput">이름 (NAME)</label>
            <input type="text" id="nameInput" value="홍길동" placeholder="이름을 입력해주세요">
        </div>

        <button id="sendBtn" onclick="sendWebhook()">
            <span class="spinner" id="spinner"></span>
            <span id="btnText">전송하기</span>
        </button>

        <div class="result-container">
            <div class="result-title">응답 결과</div>
            <div id="result" class="result-box">버튼을 눌러 요청을 실행하세요.</div>
        </div>
    </div>

    <script>
        async function sendWebhook() {
            const url = "https://digicope.app.n8n.cloud/webhook-test/greet";
            const nameValue = document.getElementById("nameInput").value;
            const data = { name: nameValue };
            
            const resultDiv = document.getElementById("result");
            const sendBtn = document.getElementById("sendBtn");
            const spinner = document.getElementById("spinner");
            const btnText = document.getElementById("btnText");

            // 로딩 상태 변경
            sendBtn.disabled = true;
            spinner.style.display = "inline-block";
            btnText.textContent = "전송 중...";
            
            resultDiv.className = "result-box";
            resultDiv.textContent = "웹훅으로 데이터 전송 중입니다...";

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const resultText = await response.text();
                    resultDiv.className = "result-box success";
                    resultDiv.textContent = resultText || "✔ 요청이 성공적으로 완료되었습니다.";
                } else {
                    resultDiv.className = "result-box error";
                    resultDiv.textContent = `✖ 요청 에러!\n상태 코드: ${response.status} ${response.statusText}`;
                }
            } catch (error) {
                resultDiv.className = "result-box error";
                resultDiv.textContent = `✖ 통신 실패\n${error.message}\n\n(CORS 설정 및 웹훅 활성화 여부를 확인해 주세요)`;
            } finally {
                // UI 상태 복원
                sendBtn.disabled = false;
                spinner.style.display = "none";
                btnText.textContent = "전송하기";
            }
        }
    </script>

</body>
</html>
